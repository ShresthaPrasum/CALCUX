<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area of 4 Walls Calculator</title>
    <link rel="stylesheet" href="/Calculators/Construction/4 Walls/style.css">
</head>
<body>

    <div id="container">

        <h1>
            Area of 4 Walls Calculator
        </h1>

        <div id="app">

            <h2>Enter all the details asked here!</h2>

            <label>
                Length of the wall (m):
            </label> <br>
            <input type="number" step="0.01" id="length">
            <br> <br>

            <label>Width of the wall</label> <br>
            <input type="number" id="width" step="0.01">
            <br> <br>

            <label>Height (m)</label> <br>
            <input type="number" id="height" step="0.01">
            <br> <br>


        </div>

    </div>
    
    <script src="/Calculators/Construction/4 Walls/script.js"></script>
</body>
</html>
