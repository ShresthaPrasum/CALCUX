<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area of 4 Walls Calculator</title>
    <link rel="stylesheet" href="/Calculators/Construction/4 Walls/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Pixelify+Sans:wght@400..700&family=Stack+Sans+Notch:wght@200..700&family=Unbounded:wght@200..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Pixelify+Sans:wght@400..700&amp;family=Unbounded:wght@200..900&amp;display=swap" rel="stylesheet">
</head>
<body>

    <div id="container">

        <h1>
            Area of 4 Walls Calculator
        </h1>

        <div id="app">

            <h2>Enter all the details asked here!</h2>
            <p>"Read Only" = Outputs</p>

            <label>
                Length of the wall (m):
            </label> <br>
            <input type="number" step="0.01" id="length">
            <br> <br>

            <label>Width of the wall</label> <br>
            <input type="number" id="width" step="0.01">
            <br> <br>

            <label>Height (m)</label> <br>
            <input type="number" id="height" step="0.01">
            <br> <br>

            <label>Area of floor/ceiling</label> <br>
            <input type="number" id="area-floor" step="0.01" readonly placeholder="Read Only">
            <br> <br>

            <label>Area of floor walls</label> <br>
            <input type="number" id="area-fourwalls" step="0.01" readonly placeholder="Read Only">
            <br> <br>

            <label>Area of 4 walls, floor and Ceiling</label> <br>
            <input type="number" id="area-fourwalls-fllor" step="0.01" readonly placeholder="Read Only">
            <br> <br>

            <h2>Find the price for painting!</h2>

            <label>Rate (per sq. m)</label> <br>
            <input type="number" step="0.01" id="rate">
            <br> <br>


            <label>Total Cost:</label> <br>
            <input type="number" step="0.01" id="total-cost" readonly placeholder="Read Only">
            <br> <br>

            <h2>Find the price for carpets!</h2>

            <label>Rate (per sq. m)</label> <br>
            <input type="number" step="0.01" id="ratee">
            <br><br>

            <label>Total Cost:</label> <br>
            <input type="number" step="0.01" id="cost-carpet" readonly placeholder="Read Only">
            <br> <br>

        </div>

    </div>
    
    <script src="/Calculators/Construction/4 Walls/script.js"></script>
</body>
</html>
