<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Size to Weight Calculator</title>
    <link rel="stylesheet" href="/Calculators/Construction/Size to Weight Calculator/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Pixelify+Sans:wght@400..700&family=Stack+Sans+Notch:wght@200..700&family=Unbounded:wght@200..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Pixelify+Sans:wght@400..700&amp;family=Unbounded:wght@200..900&amp;display=swap" rel="stylesheet">
</head>
<body>

    <div id="container">

        <a href="/construction" class="back">
            Back
        </a>

        <h1>Size to Weight Calculator (Box)</h1>

        <div id="calc">

            <h2>Enter all the details to get the answer!</h2>


            <h2>Size:</h2>

            <label>Length (m):</label> <br>
            <input type="number" id="length" step="0.01">
            <br> <br>

            <label>Width (m):</label> <br>
            <input type="number" id="width" step="0.01">
            <br> <br>

            <label>Height (m):</label> <br>
            <input type="number" id="height" step="0.01">
            <br> <br>

            <label>Volume (cubic m):</label> <br>
            <input type="number" id="volume" step="0.01" readonly placeholder="Read Only!">
            <br> <br>

            <h2>Weight:</h2>

            <label>Density (kg/cubic metre)</label> <br>
            <input type="number" id="density" step="0.01">
            <br> <br>

            <label>Weight (kg)</label> <br>
            <input type="number" id="weight" step="0.01" readonly placeholder="Read Only">
            <br> <br>

        </div>

    </div>
    
    <script src="/Calculators/Construction/Size to Weight Calculator/script.js"></script>
</body>
</html>
