<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lifetime Earnings Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="container">

        <h1>Lifetime Earnings Calculator</h1>

        <div id="calc">

            <label>Current Age (years) </label> <br>
            <input type="number" step="1" id="current-age"> 
            <br><br>

            <label>Retirement Age (years)</label> <br>
            <input type="number" step="1" id="retirement-age">
            <br><br>

            <label>Working years left (years)</label> <br>
            <input type="number" step="1" id="working-years">
            <br> <br>

            <label>Current Salary (per year)</label><br>
            <input type="number" step="1" id="current-salary">
            <br><br>

            <label>Expected Salary Increase (%)</label> <br>
            <input type="number" step="0.01" id="expected-increase">
            <br><br>

            <label>Lifetime Earnings:</label> <br>
            <input type="number" step="0.01" id="lifetime-earnings">
            <br> <br>

        </div>

    </div>
    
    <script src="script.js"></script>
</body>
</html>
