<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lifetime Earnings Calculator</title>
         <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Pixelify+Sans:wght@400..700&family=Stack+Sans+Notch:wght@200..700&family=Unbounded:wght@200..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Pixelify+Sans:wght@400..700&amp;family=Unbounded:wght@200..900&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="container">

        <h1>Lifetime Earnings Calculator</h1>

        <div id="calc">

            <h2>Fill up the details!</h2>

            <label>Current Age (years) </label> <br>
            <input type="number" step="1" id="current-age"> 
            <br><br>

            <label>Retirement Age (years)</label> <br>
            <input type="number" step="1" id="retirement-age">
            <br><br>

            <label>Working years left (years)</label> <br>
            <input type="number" step="1" id="working-years">
            <br> <br>

            <label id="currenttt">Current Salary (per year)</label><br>
            <input type="number" step="1" id="current-salary">
            <br><br>

            <label>Expected Salary Increase (%)</label> <br>
            <input type="number" step="0.01" id="expected-increase">
            <br><br>

            <label>Total Lifetime Earnings:</label> <br>
            <input type="number" step="0.01" id="lifetime-earnings">
            <br> <br>

        </div>

    </div>
    
    <script src="script.js"></script>
</body>
</html>
