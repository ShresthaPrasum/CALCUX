<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAT Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   
    <div id="container">

        <h1>VAT Calculator</h1>

        <div id="choose">

            <h2>Select One:</h2>

            <input type="radio" id="include" name="choose" checked>
            <label>Include VAT</label>
            <br> <br>

            <input type="radio" name="choose" id="exclude">
            <label>Exclude VAT</label>
            <br>

        </div>

        <div id="calc">

            <h2>Enter all the details!</h2>

            <label>Amount:</label> <br>
            <input type="number" step="0.01" id="amount">
            <br> <br>

            <label>VAT Rate:</label><br>
            <input type="number" step="0.01" id="vat">
            <br><br>

            <div id="includee">

            <label>Price:</label><br>
            <input type="number" step="0.01" id="include-price">
            <br> <br>

            <label>Tax Amount:</label> <br>
            <input type="number" step="0.01" id="tax-amount">
            <br> <br>

            </div>

            <div id="excludee" class="hide">

                <label>Price:</label> <br>
                <input type="number" step="0.01" id="exclude-price">
                <br><br>

                <label>Tax Amount:</label> <br>
                <input type="number" step="0.01" id="tax-amountt">
                <br> <br>

            </div>

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
