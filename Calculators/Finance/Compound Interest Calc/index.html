<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Pixelify+Sans:wght@400..700&family=Stack+Sans+Notch:wght@200..700&family=Unbounded:wght@200..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Pixelify+Sans:wght@400..700&amp;family=Unbounded:wght@200..900&amp;display=swap" rel="stylesheet">
    <title>Compound Interest Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <a href="/finance.html" class="back" >←Back</a>
        <h1>Compound Interest Calculator</h1>

        <div id="calculator">

            <p>Find Compound intrest of given details by entering all inputs!</p>

            <form id="form">

                <label>Principle (Balance)</label>
                <br>
                <input type="number" step="0.01" id="principle" placeholder="1000$">
            

                <label>Rate of interest (%)</label>
                <br>
                <input type="number" step="0.1" id="rate" placeholder="7%">
            

                <label>Time (months)</label>
                <br>
                <input type="number" step="1" id="months" placeholder="12">
            

                <label>Frequency:</label> <br> 

                <select name="frequency" id="frequency">

                    <option value="1">Yearly(1/yr)</option>

                    <option value="2">Semi Annualy (2/yr)</option>

                    <option value="4">Quaterly Annualy (4/yr)</option>

                </select>

                
                <button type="submit">
                    Find Result
                </button>

            </form>


         <button id="amountt" class="hide"> 
            Find Amount
         </button>

            <div id="output">
                <div id="outputt">
            
                </div>
            </div>

        </div>

    </div>
    
    <script src="script.js"></script>
</body>
</html>
