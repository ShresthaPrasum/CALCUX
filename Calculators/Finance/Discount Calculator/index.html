<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discount Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Pixelify+Sans:wght@400..700&family=Stack+Sans+Notch:wght@200..700&family=Unbounded:wght@200..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Pixelify+Sans:wght@400..700&amp;family=Unbounded:wght@200..900&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/global.css">

    <style>
        .discount{
            gap: 0.5rem;
            margin-bottom: 1.2rem;
        }

        
    </style>

</head>
<body>
    <div class="container">
        <div>
            <h1>Discount Calculator</h1>
            <a href="/finance" class="back">←Back</a>

            <h2>Enter the details:</h2>
            <div class="discount flex column">

                <label for="original-price">Original Price</label>
                <input type="number" name="original-price" id="original-price" min="0" placeholder="Enter the value" min="1">

                <label for="discount-rate">Discount (%)</label>
                <input type="number" name="discount-rate" id="discount-rate" placeholder="Enter the value" min="0" max="100">

                <label for="discount-price">Discount Amount</label>
                <input type="number" name="discount-amount" id="discount-amount" class="result" readonly >

                <label for="final-price">Final Price</label>
                <input type="number" name="final-price" id="final-price" class="result" readonly> 

            </div>
        </div>

        <div class="second-container flex">
            <div class="profile">
                <img src="/mama_chess.jpg" alt="mama_chess">
                <div class="creator-details">
                    <h3>Creator</h3>
                    <h3>Mama_Chess</h3>
                </div>
            </div>
        </div>
    </div>

    <script>
        let originalPrice = document.getElementById('original-price')

        let discountRate = document.getElementById('discount-rate')

        let discountAmount = document.getElementById('discount-amount')

        let finalPrice = document.getElementById('final-price')

        let inputs = document.querySelectorAll('input')

        inputs.forEach(e=>{
            e.addEventListener('input', ()=>{
                calculateDiscount(e);
            })
        })

        function calculateDiscount(input){
            let oPrice = parseFloat(originalPrice.value);

            let dRate = parseFloat(discountRate.value)


            let dAmount = oPrice * (dRate/100);

            let fPrice = oPrice - dAmount;

            discountAmount.value = dAmount.toFixed(2);

            finalPrice.value = fPrice;


        }
    </script>
</body>
</html>
