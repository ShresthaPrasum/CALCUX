<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nutrient Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Stack+Sans+Notch:wght@200..700" rel="stylesheet">

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            display: flex;
            /* align-items: center; */
            min-height: 100vh;
            color: white;
            justify-content: center;
            font-family: "Righteous", sans-serif;
            position: relative;
            background: linear-gradient(45deg,rgb(10, 10, 10),rgb(0, 0, 0));
        }

        .calculator{
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin-top: 20px;
            width: 80%;
        }
        .back{
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-weight: bold;
            text-decoration: none;
        }
        .header{
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .header h1{
            font-size: 5vw;
            margin-top: 20px;
            margin-bottom: 6px;
            font-weight: 100;
            color: rgb(0,255,255);
            text-shadow: 0px 0px 10px aqua;
        }

        .header p{
            font-size: 1vw;
            color: rgb(0, 183, 255);
            margin-bottom: 20px;
            text-shadow: 0px 0px 7px aqua;
        }

        .input{
            display: flex;
            gap: 20px;
            margin-top: 6px;
        }

        img{   
            width: fit-content;
            border-radius: 50%;
            height: 200px;
            object-fit: cover;
            filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.336));
        }

        input, select {
            padding: 12px 10px;
            background-color: rgb(0, 6, 9);
        
            color: white;
            width: 100%;
            font-size: 1rem;
            border: 1px solid grey;
            border-radius: 8px;
        }

        #weight{
            grid: 2;
        }

        .input-group{
            display: flex;
            flex-direction: column;
        }

        .input-group label{
            font-size: 1rem;
            color: aqua;
            margin-bottom: 5px;
        }

        .nutrient-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 4rem;
            margin-top: 20px;
            width: 100%;
        }

        .nutrient-card{
            display:flex;
            flex-direction: column;
            align-items: center;
            border: 2px solid rgba(29, 29, 29, 0.627);
            border-radius: 12px;
            padding: 15px;
            overflow: hidden;
            background-color: rgb(7, 7, 7);
        }

        .nutrient-card h2{
            text-align: center;
        }

        .nutrient-data{
            display: flex;
            background-color: rgba(0, 0, 0, 0.452);
            border-radius: 12px;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: fit-content;
            margin-top: 15px;
        }

        .nutrient-data p{
            padding: 15px;
            display: flex;
            justify-content: space-between;
            gap: 6px;
        }

        .data-value{
            color: rgb(0, 204, 255);
            text-shadow:  0px 0px 7px aqua;
            overflow-x:auto;
        }
    

        
    </style>
</head>
<body>

        <div class="header">

                </div>

                </div>
        </div>

            <div class="nutrient-card">

                            Gram:
                        </span>

                        <span class="data-value" id="fat">

                        </span>

                </div>
            </div>
            <div class="nutrient-card">

                        <span class="data-value" id="water">
                            60kg
                        </span>
                    </p>
        
                </div>
            </div>
        </div>
    </div>

</body>
</html>
