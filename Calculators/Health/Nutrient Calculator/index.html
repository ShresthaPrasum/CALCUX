<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nutrient Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Stack+Sans+Notch:wght@200..700" rel="stylesheet">

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
              font-family: "Righteous", sans-serif;
            position: relative;
            background: linear-gradient(45deg,rgb(22, 22, 22),rgb(0, 0, 0));
        }

        .calculator{
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin-top: 20px;
            width: 80%;
        }
        .back{
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-weight: bold;
            text-decoration: none;
        }
        .header{
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .header h1{
            font-size: 5vw;
            margin-top: 20px;
            font-weight: 100;
            color: rgb(0,255,255);
            text-shadow: 0px 0px 10px aqua;
        }

        .header p{
            font-size: 1vw;
            color: aqua;
            margin-bottom: 20px;
            text-shadow: 0px 0px 7px aqua;
        }

        
    </style>
</head>
<body>
    <div class="container">
        <a href="/health" class="back">←Back</a>
        <div class="header">
            <h1>Nutrients Calculator</h1>

            <p>
                Calculate your daily macro nutrients intake that your body needs!
            </p>

            <div class="input flex ai">
                <div class="input-group">
                    <label for=""></label>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
