<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percentage Change Calculator</title>
    <link rel="stylesheet" href="style.css">
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Pixelify+Sans:wght@400..700&family=Stack+Sans+Notch:wght@200..700&family=Unbounded:wght@200..900&display=swap" rel="stylesheet">

</head>
<body>

    <div id="container">
        <a href="/math.html" class="back" >←Back</a>
        <h1>Percentage Change Calculator</h1>
        <p id="details">Find the percentage changed by giving the details of .</p>

        <div id="calculator">
            <p>Enter the details asked below:</p>

            <form id="form">
                
                <label>Initial Value</label> <br>
                <input type="number" id="initial-value" step="1"> <br> <br>

                <label>Final Value</label> <br> 
                <input type="number" name="final-value" id="final-value" step="1"> <br> <br>

                <button id="submit-btn" type="submit">
                    Submit
                </button>

            </form>

            <div id="result-box" class="hide">
                <h2>Result</h2>

                <!--soon-->

            </div>

        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
