<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percentage Change Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="container">

        <h1>Percentage Change Calculator</h1>
        <p id="details">Find the percentage changed by giving the details of .</p>

        <div id="calculator">
            <h2>Calculate!</h2> <br>
            <p>Enter the details asked below:</p>

            <form id="form">
                
                <label>Initial Value</label> <br>
                <input type="number" id="initial-value" step="1"> <br> <br>

                <label>Final Value</label> <br> 
                <input type="number" name="final-value" id="final-value" step="1"> <br> <br>

                <button id="submit-btn" type="submit">
                    Submit
                </button>

            </form>

            <div id="result-box" class="hide">
                <h2>Result</h2>

                <!--soon-->

            </div>

        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
