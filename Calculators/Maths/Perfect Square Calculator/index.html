<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfect Square Checker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="container">

        <h1>Perfect Number Checker</h1>

        <div id="app">

            <h2>Check!</h2>
            <p>Check if the given number is a square number or not by giving the number value below:</p>

            <form id="form">

                <label>Number:</label>

                <br>

                <input type="number" id="input" name="num"> <br><br>

                <button id="submit">
                    Submit
                </button>

            </form>

            <div id="output" class="output ">
                <h2>RESULT</h2>
                <p>SOONNN!!</p>
            </div>

        </div>

    </div>
    
    <script src="script.js"></script>
</body>
</html>
