<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metric/Imperial Length Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="container">

        <h1>Unit Converter</h1>
        <p>Enter the value of length in any one of the input and you will get its value in rest of the units!</p>
        <a href="/math.html" class="back" >←Back</a>
        <div id="converter">
            

            <div id="metric">

            <h3>Metric Units:</h3>

            <label>
                In milimeters (mm):
            </label> <br>
            <input type="number" id="mm" name="mm" step="0.1">
            <br> <br>

            <label>
                In Centimeters (cm):
            </label> <br> 
            <input type="number" id="cm" name="cm" step="0.1">
            <br> <br>

            <label>
                In meters (m):
            </label> <br>
            <input type="number" id="m" name="m" step="0.1">
            <br> <br>

            <label>
                In Kilometres (km):
            </label> <br>
            <input type="number" id="km" name="km" step="0.1"> 
            <br> <br>

            </div>

            <div id="imperial">

            <h3>Imperial Units:</h3>

            <label>
                In inches (in):
            </label> <br>
            <input type="number" id="in" name="in" step="0.1">
             <br> <br>

            <label>
                In feet (ft):
            </label> <br>
            <input type="number" id="ft" name="ft" step="0.1">
            <br> <br>

            <label>
                In Yards (yd):
            </label> <br>
            <input type="number" id="yd" name="yd" step="0.1">
            <br> <br>

            <label>
                In miles (mi):
            </label> <br>
            <input type="number" id="mi" name="mi" step="0.1">
            <br> <br>

            <label>
                In light years (li):
            </label> <br>
            <input type="number" id="li" name="li" step="0.0001">
            <br>

            </div>


        </div>

    </div>
    
    <script src="script.js"></script>
</body>
</html>
