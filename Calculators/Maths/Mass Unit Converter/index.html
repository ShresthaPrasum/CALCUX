<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mass Unit Converter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Pixelify+Sans:wght@400..700&family=Stack+Sans+Notch:wght@200..700&family=Unbounded:wght@200..900&display=swap" rel="stylesheet">
    
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Pixelify+Sans:wght@400..700&amp;family=Unbounded:wght@200..900&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/global.css">

    <style>
        #container{
            position:relative;
            min-height: 67vh;
            min-width: 66vw;
            background-color: rgb(51, 127, 126);
            border: none;
            padding: 40px;
            border-radius: 10px;
        }

        #mass{
            display: flex;
            justify-content: center;
        }

        .section{
            width: 50%;
            background-color: rgb(44, 101, 116);
            padding: 10px;
            margin: 15px;
            border: 2px solid rgb(9, 85, 126);
            border-radius: 10px;
        }

        h3{
            font-size: 38px;
            font-weight: 900;
            text-align: center;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div id="container">
        <div>
            <h1>Mass Unit Converter</h1>

            <p>Enter the value in any one input area: </p>

            <a href="/math" class="back">←Back</a>

            <div id="mass">
                <div class="section">
                    <div class="result-card">
                        <label for="t">Ton(t)</label>
                        <input type="number" id="t" name="t" class="">
                    </div>

                    <div class="result-card">
                        <label for="kg">Kilogram(kg)</label>
                        <input type="number" name="kg" id="kg">
                    </div>

                    <div class="result-card">
                        <label for="g">Gram(g)</label>
                        <input type="number" name="g" id="g">
                    </div>

                    <div class="result-card">
                        <label for="mg">Milligram(mg)</label>
                        <input type="number" name="mg" id="mg">
                    </div>

                    <div class="result-card">
                        <label for="ug">Microgram(μg)</label>
                        <input type="number" name="ug" id="ug">
                    </div>
                </div>

                <div class="section">
                    <div class="result-card">
                        <label for="ng">Nanogram(ng)</label>
                        <input type="number" name="ng" id="ng">
                    </div>

                    <div class="result-card">
                        <label for="pg">Picogram(pg)</label>
                        <input type="number" name="pg" id="pg">
                    </div>

                    <div class="result-card">
                        <label for="lb">Pound(lb)</label>
                        <input type="number" name="lb" id="lb">
                    </div>

                    <div class="result-card">
                        <label for="oz">Ounce(oz)</label>
                        <input type="number" name="oz" id="oz">
                    </div>

                    <div class="result-card">
                        <label for="ct">Carat(ct)</label>
                        <input type="number" name="ct" id="ct">
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        const gramFactors = {
            t : 1000000,
            kg : 1000,
            g: 1,
            mg : 0.001,
            ug : 0.000001,
            ng : 0.000000001,
            pg: 0.000000000001,
            lb: 453.59237,     
            oz: 28.349523125,     
            ct: 0.2,              
        }

        const inputs = document.querySelectorAll('input');

        inputs.forEach(input =>{
            input.addEventListener('input', (e)=>{
                const aUnit = e.target.id;
                const rData = e.target.value;

                const inputValue = parseFloat(rData);

                const valueGram = inputValue * gramFactors[aUnit];

                inputs.forEach(e =>{
                    if(e.id!==aUnit){
                        const convertedValue = valueGram / gramFactors[e.id];

                        e.value = convertedValue;
                    }
                })
            })
        })


    </script>
</body>
</html>
