<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Probability Calculator (3 events)</title>
    <link rel="stylesheet" href="/Calculators/Maths/Probability Calculator/style.css">
</head>
<body>

    <div id="container">

        <a href="/math" class="back">
            Back
        </a>

        <h1>
            Probability Calculator
        </h1>

        <div id="app">

            <h2>Fill up all the infos asked:</h2>

            <label>P(A)</label> <br>
            <input type="number" id="pa" step="0.01" placeholder="In %">
            <br> <br>

            <label>P(B)</label> <br>
            <input type="number" id="pb" step="0.01" placeholder="In %">
            <br> <br>

            <label>P(C)</label> <br>
            <input type="number" id="pc" step="0.01" placeholder="In %">
            <br> <br>

            <br> <br>
            <h2>Probability:</h2>

            <label>For all 3</label> <br>
            <input type="number" id="all" placeholder="Read only" readonly>
            <br> <br>

            <label>At Least One</label> <br>
            <input type="number" id="atleastone" placeholder="Read Only" readonly>
            <br> <br>

            <label>None of them</label> <br>
            <input type="number" id="none" placeholder="Read Only" readonly>
            <br> <br>

            <label>Exactly One</label> <br>
            <input type="number" id="exactly-one" placeholder="Read Only" readonly>
            <br> <br>

            <button id="submit">
                Submit!
            </button>

        </div>

    </div>
    
    <script src="/Calculators/Maths/Probability Calculator/script.js"></script>
</body>
</html>
