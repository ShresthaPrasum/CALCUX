<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velocity Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="container">

        <h1>Velocity Calculator</h1>
        <p>Select a option and enter the info to get your answer!</p>

        <div id="app">

            <div id="radios" class="radios">

                <input type="radio" name="select" class="select" checked>
                <label>Distance Covered</label>
                <br> 

                <input type="radio" name="select" class="select">
                <label>Accleration </label>
                <br> <br>

                <!-- <input type="radio" name="select" class="select">
                <label>Average Velocity</label>
                <br> -->

            </div>

            <div id="distancee" class="radios hide">

                <label>Distance Covered:</label> <br>
                <input type="number" id="numberr"> 
                <br> <br>

                <label>Time taken:</label> <br>
                <input type="number" id="time">
                <br> <br>

                <label>Velocity:</label> <br>
                <input type="number" class="velocity">
                <br> <br>

            </div>

            <div id="accleration" class="">

                <label>Initial Velocity:</label> <br>
                <input type="number" id="init-vel">
                <br> <br>

                <label>Acclearation:</label> <br>
                <input type="number" id="acc"> 
                <br> <br>

                <label>Time:</label> <br>
                <input type="number" id="timee">
                <br> <br>

                <label>Final Velocity:</label> <br>
                <input type="number" id="fin-vel">
                <br> <br>

            </div>

        </div>

    </div>
    
    <script src="script.js"></script>
</body>
</html>
