<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volume Converter/Calculator</title>
    <link rel="stylesheet" href="/Calculators/Maths/Volume Converter/style.css">
    <link rel="stylesheet" href="/global.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Pixelify+Sans:wght@400..700&family=Stack+Sans+Notch:wght@200..700&family=Unbounded:wght@200..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Pixelify+Sans:wght@400..700&amp;family=Unbounded:wght@200..900&amp;display=swap" rel="stylesheet">
</head>
<body>

    <div id="container">

        <a href="/math" class="back">
            Back
        </a>

        <h1>Volume Converter</h1>

        <div id="calc">

            <h2>Enter all the details asked!</h2>

            <label>Volume (in milileters):</label> <br>
            <input type="number" id="vol-ml" step="0.01">
            <br> <br>

            <label>Volume (in litres):</label> <br>
            <input type="number" id="vol-l" step="0.01">
            <br> <br>

            <label>Volume (in gallons):</label> <br>
            <input type="number" id="vol-gal" step="0.01">
            <br> <br>

            <label>Volume (in quarts):</label> <br>
            <input type="number" id="vol-quarts" step="0.01">
            <br> <br>

            <label>Volume (in pints):</label> <br>
            <input type="number" id="vol-pints" step="0.01">
            <br> <br>

            <label>Volume (in cups):</label> <br>
            <input type="number" id="vol-cups" step="0.01">
            <br> <br>

            <label>Volume (in ounces):</label> <br>
            <input type="number" id="vol-ounces" step="0.01">
            <br> <br>

            <label>Volume (in tablespoons):</label> <br>
            <input type="number" id="vol-table" step="0.01">
            <br> <br>

            <label>Volume (in teaspoons):</label> <br>
            <input type="number" id="vol-teaspoons" step="0.01">
            <br> <br>

        </div>

    </div>
    
    <script src="/Calculators/Maths/Volume Converter/script.js"></script>
</body>
</html>
