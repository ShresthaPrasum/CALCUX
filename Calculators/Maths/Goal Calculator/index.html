<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Calculator</title>
    <link rel="stylesheet" href="/Calculators/Maths/Goal Calculator/style.css">
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Pixelify+Sans:wght@400..700&family=Stack+Sans+Notch:wght@200..700&family=Unbounded:wght@200..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Pixelify+Sans:wght@400..700&amp;family=Unbounded:wght@200..900&amp;display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/global.css">
</head>
<body>

    <div id="container" class="flex">
        
        <a href="/math" class="back white" >←Back</a>
        
           <div id="app flex column">
            <h1>Progress Calculator</h1>
            <p class="must">You must enter the details asked below to find how much progress have you done!</p>
            
            <form id="form">

                <label>
                    Goal:
                </label>
                <br> 
                <input type="number" step="0.1" id="goal">
                <br> <br>

                <label>
                    Progress:
                </label>
                <br>
                <input type="number" step="0.1" id="progress">
                <br> <br>

                <button type="submit">
                    Submit
                </button>

            </form>

            <div class="result column ai jc hide">
                <h2>Result</h2>
                <p>lorem</p>

                <h3 id="progresss-bar">Progress in progress bar:</h3> 

                <div id="progress-bar">
                    <div id="progresss"></div>
                </div>

            </div>

        </div>
        <div class="second-container flex">
            <div class="profile">
                <img src="/zyrox.jpg" alt="zyrox.jpg">
                <div class="creator-details">
                    <h3>Creator</h3>
                    <h3>Zyrox</h3>
                </div>
                <img src="/mama_chess.jpg" alt="">
                <div class="creator-details">
                    <h3>Css Designer</h3>
                    <h3>Mama_Chess</h3>
                </div>
            </div>

        </div>

    </div>
    
    <script src="/Calculators/Maths/Goal Calculator/script.js"></script>
</body>
</html>
