<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="container">

        <h1>Progress Calculator</h1>
        <p class="info">Progress Calculator is a mathmatical calculator which calculates your progress to the goal in percentage.</p>

        <div id="app">
            <p class="must">You must enter the details asked below to find how much progress have you done!</p>

            <form id="form">

                <label>
                    Goal:
                </label>
                <br> 
                <input type="number" step="0.1" id="goal">
                <br> <br>

                <label>
                    Progress:
                </label>
                <br>
                <input type="number" step="0.1" id="progress">
                <br> <br>

                <button type="submit">
                    Submit
                </button>

            </form>

            <div class="result hide">
                <h2>Result</h2>
                <p>lorem</p>

                <h3 id="progresss-bar">Progress in progress bar:</h3> 

                <div id="progress-bar">
                    <div id="progresss"></div>
                </div>

            </div>

        </div>

    </div>
    
    <script src="script.js"></script>
</body>
</html>
