<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="container">

        <h1>Progress Calculator</h1>
        <p>Progress Calculator is a mathmatical calculator which calculates your progress to the goal in percentage.</p>

        <div id="app">

            <h2>Calculate!</h2>
            <p>You must enter the details asked below to find how much progress have you done!</p>

            <form id="form">

                <label>
                    Goal
                </label>
                <input type="number" step="1" id="goal">

                <label>
                    Progress
                </label>
                <input type="number" step="1" id="progress">

                <button type="submit">
                    Submit
                </button>

            </form>

            <div class="result">
                <h2>Result</h2>
            </div>

        </div>

    </div>
    
    <script src="script.js"></script>
</body>
</html>
