<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accleration Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div id="container">

        <h1>Accleration Calculator</h1>

        <div class="choose">

            <input type="radio" name="choose" value="speed">
            <label>Speed Difference</label>
            <br><br>

            <input type="radio" name="choose" value="distance">
            <label>Distance Travelled</label>
            <br><br>

            <input type="radio" name="choose" value="mass">
            <label>Mass and Volume</label>
            <br><br>

        </div>

        <div id="calc">

            <div id="speed">

            <label>Initial Speed (u)</label> <br>
            <input type="number" step="0.1" id="u">
            <br> <br>

            <label>Final speed (v)</label> <br>
            <input type="number" step="0.1" id="v">
            <br> <br>

            <label>Time (s)</label> <br>
            <input type="number" step="0.1" id="t">
            <br><br>

            <label>Accleration </label> <br>
            <input type="number" step="0.1" id="a">
            <br><br>

            </div>

            <div id="distance">

                <label>Speed</label> <br>
                <input type="number" step="0.1" id="sp"> 
                <br> <br>

                <label>Distance</label> <br>
                <input type="number" step="0.1" id="di">
                <br> <br>

                <label>Time</label> <br>
                <input type="number" step="0.1" id="ti"> 
                <br> <br>

                <label>Accleration</label> <br>
                <input type="number" step="0.1" id="acc">
                <br><br>


            </div>

            <div id="force">

                <label>Mass </label> <br>
                <input type="number" step="0.1" id="mass">
                <br><br>

                <label>Force </label> <br>
                <input type="number" step="0.1" id="force">
                <br> <br>

                <label>Accleration</label> <br>
                <input type="number" step="0.1" id="accleration">
                <br><br>

            </div>

        </div>
        
    </div>

    <script src="script.js"></script>
</body>
</html>
