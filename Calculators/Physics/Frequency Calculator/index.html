<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Pixelify+Sans:wght@400..700&family=Stack+Sans+Notch:wght@200..700&family=Unbounded:wght@200..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Pixelify+Sans:wght@400..700&amp;family=Unbounded:wght@200..900&amp;display=swap" rel="stylesheet">
    <title>Frequency Calculator</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            display: flex;
            background: linear-gradient(45deg,rgb(202, 228, 246),rgb(182, 224, 227));
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: "Stack Sans Notch", sans-serif;
            color: whitesmoke;
        }

        .container{
            position: relative;
            display: flex;
            flex-direction: column;
            height: fit-content;
            width: fit-content;
            min-width: 50vw;
            background-color: rgb(51,127,126);
            padding: 40px;
            border-radius: 10px;
            
        }

        .frequency-calculator{
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1.2rem;
        }

        .back{
            position: absolute;
            top: 30px;
            left: 30px;
            color: white;
            font-weight: bold;
            text-decoration: none;
        }

        h1{
            font-size: clamp(2rem, 3.8vw, 3.5rem);text-align: center;line-height: 1.1;
        }

        p{
            font-size: clamp(0.7rem, 1.1vw, 1.8rem);text-align: center;margin-bottom: 10px;
        }

        input, select{
            display: flex;
            text-indent: 10px;
            color: black;
            min-height: 40px;
            text-align: left;
            width: 100%;
            font-size: 1.4rem;
            line-height: 40px;
            font-weight: 450;
            border-radius: 6px;
            border-style: solid;
            border-width: 1px;
            outline: none;
        }

        .inputSection{
            display: flex;
        }
        #wavelength{
            width: 80%;
        }

        #lengthunit, #timeunit{
            width: 20%;
            font-size: 17px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Frequency Calculator</h1>
        <p>Calculate the a wave's frequency given period(time), wavelength and velocity</p>
        <a href="/physic.html" class="back">←Back</a>

        <div class="frequency-calculator">
            <label for="velocity">Wave Velocity</label>
            <select name="velocity" id="velocity">
                <option disabled>Select</option>
                <option value="lightVacuum">Light In Vacuum</option>
                <option value="lightAir">Light In Air</option>
                <option value="lightWater">Light In Water</option>
                <option value="lightGlass">Light In Glass</option>
            </select>
            <label for="velocityValue">Velocity Value</label>
            <input type="text" id="velocityvalue" name="velocityValue" value = "299,792,458" readonly>

            <label for="wavelength">Wavelength(λ)</label>
            <div class="inputSection">
                <input type="number" id="wavelength" name="wavelength">
                <select name="lengthunit" id="lengthunit">
                    <option value="meter">Meter</option>
                    <option value="centimeter">Centimeter</option>
                    <option value="millimeter">Millimeter</option>
                </select>
            </div>

            <label for="period">Period(T)</label>

                <input type="text" name="period" id="period" readonly>

            <label for="frequency">Frequency(f)</label>
            <input type="text" name="frequency" id="frequency" readonly>
        </div>
    </div>
    <script>
        let velocity = document.getElementById('velocity')

        let velocityDisplay = document.getElementById('velocityvalue')

        let waveLength = document.getElementById('wavelength')

        let periodTime = document.getElementById('period')

        let f = document.getElementById('frequency')

        let lengthUnit = document.getElementById('lengthunit');

        let inputs = document.querySelectorAll('input, select')


        const lightSpeed = {
            'lightVacuum' : 299792458,
            'lightAir' : 299702547,
            'lightWater' : 225238511,
            'lightGlass' : 199861639
        }
        
        inputs.forEach(e=>{
            e.addEventListener('input',()=>{
                let velocityValue = velocity.value;

                let velocityDisplayValue = null;


                let l = waveLength.value;

                let lengthUnitValue = lengthUnit.value;

                if(lengthUnitValue === "centimeter"){
                    l = l/100;
                }
                else if(lengthUnitValue === "millimeter"){
                    l = l/1000;
                }

                for(const key in lightSpeed){
                    if(velocityValue === key){
                        velocityDisplay.value = lightSpeed[key];
                        velocityDisplayValue = lightSpeed[key]
                    }
                }

                let fValue;

                if((velocityDisplayValue/l)<500 && (velocityDisplayValue/l)>0.1){
                     fValue = ((velocityDisplayValue/l).toFixed(3))
                }

                else if((velocityDisplayValue/l)<0.1){
                    fValue = ((velocityDisplayValue/l).toFixed(8))
                }

                else{
                    fValue = ((velocityDisplayValue/l).toFixed(0))
                }
                

                let tValue = (1/fValue).toPrecision(3)

                

                f.value = `${fValue} Hz`;

                periodTime.value = `${tValue} s`;

                
            })
        })
    </script>
</body>
</html>
