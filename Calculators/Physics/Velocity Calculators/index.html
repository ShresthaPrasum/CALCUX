<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velocity Calculator</title>
    <link rel="stylesheet" href="/Calculators/Physics/Velocity Calculators/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Pixelify+Sans:wght@400..700&family=Stack+Sans+Notch:wght@200..700&family=Unbounded:wght@200..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Pixelify+Sans:wght@400..700&amp;family=Unbounded:wght@200..900&amp;display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/global.css">
</head>
<body>

    <div class="container">
        <div>
            <a href="/physics" class="back" >←Back</a>
            <h1>Velocity Calculator</h1>
            <p>Select a option and enter the info to get your answer!</p>

            <div id="app">
    
                <div id="radios" class="radios">
    
                    <input type="radio" name="select" class="select" checked id="distance">
                    <label>Distance Covered</label>
                    
    
                    <input type="radio" name="select" class="select" id="acclerationm">
                    <label>Accleration </label>
                    <br>
                    
                </div>
    
                <div id="distancee">
    
                    <label>Distance Covered:</label> <br>
                    <input type="number" id="numberr" step="0.01"> 
                    <br>
    
                    <label>Time taken:</label> <br>
                    <input type="number" id="time" step="0.01">
                    <br>
    
                    <label>Velocity:</label> <br>
                    <input type="number" class="velocity" step="0.01" placeholder="Leave it empty! Else submit!">
                    <br>
    
                    <button class="submit">Submit</button>
    
                </div>
    
                <div id="accleration" class="hide">
    
                    <label>Initial Velocity:</label>
                    <input type="number" id="init-vel" step="0.01">
                    
    
                    <label>Acclearation:</label>
                    <input type="number" id="acc" step="0.01"> 
                    
    
                    <label>Time:</label>
                    <input type="number" id="timee" step="0.01">
                    
    
                    <label>Final Velocity:</label> 
                    <input type="number" id="fin-vel" placeholder="Submit to update!" step="0.01">
                    <br>
    
                    <button class="submitt">Submit</button>
    
                </div>
    
            </div>
        </div>

        <div class="second-container flex">
            <div class="profile">
                <img src="/zyrox.jpg" alt="zyrox.jpg">
                <div class="creator-details">
                    <h3>Creator</h3>
                    <h3>Zyrox</h3>
                </div>
                <img src="/mama_chess.jpg" alt="">
                <div class="creator-details">
                    <h3>Css Designer</h3>
                    <h3>Mama_Chess</h3>
                </div>
            </div>

        </div>

    </div>
    
    <script src="/Calculators/Physics/Velocity Calculators/script.js"></script>
</body>
</html>
