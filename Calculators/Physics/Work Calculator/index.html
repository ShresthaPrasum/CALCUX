<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="container">

        <h1>Work Calculator</h1>


        <div id="calc">

            <h2>Fill up all the asked details!</h2>

            <label>Force (N)</label> <br>
            <input type="number" step="0.01" id="force">
            <br> <br>

            <label>Angle of force (deg)</label> <br>
            <input type="number" step="0.01" id="angle">
            <br> <br>

            <label>Displacement (m)</label> <br>
            <input type="number" step="0.01" id="displacement">
            <br> <br>

            <label>Work</label> <br>
            <input type="number" step="0.01" id="work" placeholder="Please enter other details first!"> 
            <br><br>


            <button id="submitbtn">
                Submit!
            </button>

        </div>

    </div>
    
    <script src="script.js"></script>
</body>
</html>
