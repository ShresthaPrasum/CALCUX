<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projectile Motion Calculator</title>
    <link rel="stylesheet" href="/Calculators/Physics/Projectile Motion Calculator/style.css">
</head>
<body>

    <div id="container">

        <h1>Projectile Motion Calculator</h1>

        <div id="app">

            <h2>Fill up all the details and the answer will be displayed!</h2>

            <label>Initial Velocity (v)</label> <br>
            <input type="number" step="0.01" id="init-vel">
            <br> <br>

            <label>Angle of launch</label> <br>
            <input type="number" step="0.01" id="angle">
            <br> <br>

            <label>Initial Height</label> <br>
            <input type="number" step="0.01" id="init-height">
            <br> <br>


            <label>Maximum Height reached</label> <br>
            <input type="number" step="0.01" id="max-height">
            <br> <br>

            <label>Distance travelled</label> <br>
            <input type="number" step="0.01" id="distance">
            <br> <br>

            <label>Time taken</label> <br>
            <input type="number" step="0.01" id="time">
            <br> <br>

            <button type="submit">
                Submit
            </button>

        </div>

    </div>
    
    <script src="/Calculators/Physics/Projectile Motion Calculator/script.js"></script>
</body>
</html>
