<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcux - Calculate anything</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Pixelify+Sans:wght@400..700&amp;family=Unbounded:wght@200..900&amp;display=swap" rel="stylesheet">

    <style>
        :root{
            --font-family : "Unbounded", sans-serif;
            --grey-text: rgba(9,9,9,0.5);

        }
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,body{
            background-color: rgb(164, 255, 246);
            scroll-behavior: smooth;
            font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            height: 100%;
        }

        header{
            display: none;
            position: fixed;
            height: 100%;
            z-index: 0;
            top: 0;
            right: 0;
            width: 100%;
            transition: all 0.3s ease;
        }

        nav{
            display: flex;
            position: absolute;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            top: 0;
            right: 0;
            width: 17%;
            height: 100%;
        }

        .brand{
            font-family: "Unbounded", sans-serif;
            position: absolute;
            top: 16px;
            font-size: 1.1rem;
            left: 42px;
        }

        nav ul{
            display: flex;
            flex-direction: column;
            list-style: none;
            gap: 20px;
        }

        nav ul li{
            display: flex;
            margin: 0 20px;
        }

        nav ul li a{
            font-size: 1.8rem;
            font-weight: bold;
        }

        a{
            text-decoration: none;
            color: inherit;
        }

        .nav-main{
            display: flex;
            gap: 20px;
            font-size: 1rem;
        }

        .main{
            /* position: relative; */
            height: 100%;
            transition: all 0.6s ease;
        }

        .logo{
            position: fixed;
            padding: 12px 13px;
            border-radius: 50%;
            font-size: 1.2rem;
            background-color: black;
            color: white;
            right: 42px;
            top: 18px;
            cursor: pointer;
            z-index: 6967;
        }

        .nav{
            transform: translateX(-17%);
        }

        .active{
            display: block;
        }
        

        .hero{
            display: flex;
            justify-content:center;
            background: linear-gradient(45deg,rgb(245, 254, 255),rgb(226, 254, 249));
            padding: 70px;
            height: 100%;
            /* width: 80%; */
        }

        .container{
            display: flex;
            width: 80%;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
            height: 90vh;
        }

        .hero-first h1{
            font-size: 4rem;
            letter-spacing: -1px;
            font-family: var(--font-family);
        }

        .horizontal{
            position: absolute;
            top: 10%;
            width: 100%;
            border: 1px solid rgba(23, 23, 23, 0.192);
        }

        .hero-first p{
            font-family: var(--font-family);
            color: var(--grey-text);
            width: 80%;
        }

        .hero-visual{
            width: 50%;
        }

        .mini-calculator{
            width: 300px;
            min-height: 400px;
            background-color: rgb(9, 9, 9);
            border-radius: 10px;
            padding: 1.5rem;
            border: 2px solid   black;
        }

        .calculator-display{
            color: white;
            min-height: 90px;
            padding: 1.5rem 1rem;
            border-radius: 8px;
            border: 2px solid black;
            background-color: rgba(97, 97, 97, 0.522);
            text-align: right;
            font-size: 2rem;
            font-weight: 777;
            margin-bottom: 1rem;
            overflow-wrap: break-word;
        }

        .calculator-btns{
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
        }

        .calc-btn{
            color: white;
            padding: 1.3rem 1rem;
            background-color: black;
            border: 2px solid grey;
            font-size: 1.2rem;
            border-radius: 8px;
            cursor: pointer;
        }

    </style>
</head>
<body>
    <header>
        
        <nav>
            
            <ul>
                <li><a href="#"><i class="fas fa-home"></i>Home</a></li>
                <li><a href="#"><i class="fa-solid fa-calculator"></i>Calculators</a></li>
                <li><a href="#"><i class="fas fa-question"></i></i>How it works</a></li>
                <li><a href="#"><i class="fas fa-circle-info"></i>About Us</a></li>
            </ul>
        </nav>
    </header>
    <div class="main">
        <div class="brand">
            <h1>Calcux</h1>
        </div>
        <hr class="horizontal">

        <i class="fas fa-bars logo">

        </i>

        <div class="hero">
            <div class="container">
                <div class="hero-first">
                    <h1>
                        Calculate the  <br/>numbers and <br/> find it out
                    </h1>
                    <p>
                        From calculating percentage changes to solving economics problems and improving it. Calculators and converter for everything.
                    </p>
                </div>
    
                <div class="hero-visual">
                    <div class="mini-calculator">
                        <div class="calculator-display">

                        </div>

                        <div class="calculator-btns">
                            <button class="calc-btn">C</button>
                            <button class="calc-btn">/</button>
                            <button class="calc-btn">×</button>
                            <button class="calc-btn">⌫</button>
                            <button class="calc-btn">7</button>
                            <button class="calc-btn">8</button>
                            <button class="calc-btn">9</button>
                            <button class="calc-btn">-</button>
                            <button class="calc-btn">4</button>
                            <button class="calc-btn">5</button>
                            <button class="calc-btn">6</button>
                            <button class="calc-btn">+</button>
                            <button class="calc-btn">1</button>
                            <button class="calc-btn">2</button>
                            <button class="calc-btn">3</button>
                            <button class="calc-btn" style="grid-row: span 2;">=</button>
                            <button class="calc-btn" style="grid-column: span 2;">0</button>
                            <button class="calc-btn">.</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const navbtn = document.querySelector('.logo');

        const navContainer = document.querySelector('header');

        const mainContainer = document.querySelector('.main')

        const ulContainer = document.querySelectorAll('ul');

        const ulList = document.querySelectorAll('nav ul li a')

        const calcdisplay = document.querySelector('.calculator-display')

        const calcbtns = document.querySelectorAll('.calc-btn')
        let active = false;

        // const bgColor = window.getComputedStyle(document.body).backgroundColor;
        const bgColor = window.getComputedStyle(document.body).getPropertyValue('background-color');

        console.log(bgColor);

        calcbtns.forEach(e =>{
            e.addEventListener('click',()=>{
                const btnValue = e.textContent;

                if(btnValue ==='C'){
                    calcdisplay.textContent = ''
                }
                else if(btnValue === '⌫'){
                    calcdisplay.textContent =calcdisplay.textContent.slice(0, -1);
                }
                else if(btnValue === '='){
                    try{
                        
                    }
                    catch{
                        calcdisplay.textContent = 'Error';
                    }
                }
                else{

                    calcdisplay.textContent += e.textContent;
                }
            });
        });


        navbtn.addEventListener('click',()=>{
            if(!active){
                active= true;
                navContainer.classList.add('active')
                mainContainer.classList.add('nav')
            }

            else{
                active= false;
                // navContainer.classList.remove('active');
                setTimeout(()=>{
                    navContainer.classList.remove('active')
                }, 500)
                mainContainer.classList.remove('nav');
            }
        })

        ulList.forEach(e => {
            e.addEventListener('click', ()=>{
                active  = false;
                // navContainer.classList.remove('active')
                setTimeout(()=>{
                    navContainer.classList.remove('active')
                }, 500)
                mainContainer.classList.remove('nav')    
            })
        });
    </script>
</body>
</html>
