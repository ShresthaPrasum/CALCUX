<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcux - Calculate anything</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,body{
            background: linear-gradient(45deg,rgb(239, 254, 255),rgb(210, 255, 246));
            scroll-behavior: smooth;
            font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            height: 100%;
        }

        header{
            display: block;
            position: fixed;
            height: 100%;
            z-index: 0;
            top: 0;
            right: 0;
            width: 100%;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        nav{
            display: flex;
            position: absolute;
            justify-content: center;
            align-items: center;
            background-color: antiquewhite;
            width: 20%;
            height: 100%;
            right: 0;
            
        }

        nav ul{
            display: flex;
            flex-direction: column;
            list-style: none;
            gap: 20px;
        }

        nav ul li{
            margin: 0 20px;
        }

        nav ul li a{
            font-size: 1.8rem;
            font-weight: bold;
        }

        a{
            text-decoration: none;
            color: inherit;
        }

        .nav-main{
            display: flex;
            gap: 20px;
            font-size: 1rem;
        }

        main{
            position: relative;
            height: 100%;
        }

        .logo{
            position: fixed;
            padding: 12px 13px;
            border-radius: 50%;
            font-size: 1.2rem;
            background-color: black;
            color: white;
            right: 40px;
            top: 40px;
            cursor: pointer;
            z-index: 6967;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="#"><i class="fas fa-home"></i>Home</a></li>
                <li><a href="#"><i class="fa-solid fa-calculator"></i>Calculators</a></li>
                <li><a href="#"><i class="fas fa-question"></i></i>How it works</a></li>
                <li><a href="#"><i class="fas fa-circle-info"></i>About Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="hero">
            <i class="fas fa-bars logo"></i>
        </div>
    </main>
</body>
</html>
