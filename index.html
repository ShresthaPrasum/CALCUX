<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcux - Calculate anything</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,body{
            background-color: rgb(164, 255, 246);
            scroll-behavior: smooth;
            font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            height: 100%;
        }

        header{
            display: none;
            position: fixed;
            height: 100%;
            z-index: 0;
            top: 0;
            right: 0;
            width: 100%;
            transition: all 0.3s ease;
        }

        nav{
            display: flex;
            position: absolute;
            justify-content: center;
            align-items: center;
            
            width: 20%;
            height: 100%;
            right: 0;
        }

        nav ul{
            display: flex;
            flex-direction: column;
            list-style: none;
            gap: 20px;
        }

        nav ul li{
            margin: 0 20px;
        }

        nav ul li a{
            font-size: 1.8rem;
            font-weight: bold;
        }

        a{
            text-decoration: none;
            color: inherit;
        }

        .nav-main{
            display: flex;
            gap: 20px;
            font-size: 1rem;
        }

        .main{
            /* position: relative; */
            height: 100%;
            transition: all 0.6s ease;
        }

        .logo{
            position: fixed;
            padding: 12px 13px;
            border-radius: 50%;
            font-size: 1.2rem;
            background-color: black;
            color: white;
            right: 40px;
            top: 40px;
            cursor: pointer;
            z-index: 6967;
        }

        .nav{
            transform: translateX(-20%);
        }

        .active{
            display: block;
        }
        

        .hero{
            display: flex;
            justify-content:center;
            background: linear-gradient(45deg,rgb(226, 253, 255),rgb(210, 255, 246));
            padding:40px;
            height: 100%;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="#"><i class="fas fa-home"></i>Home</a></li>
                <li><a href="#"><i class="fa-solid fa-calculator"></i>Calculators</a></li>
                <li><a href="#"><i class="fas fa-question"></i></i>How it works</a></li>
                <li><a href="#"><i class="fas fa-circle-info"></i>About Us</a></li>
            </ul>
        </nav>
    </header>
    <div class="main">
        <div class="hero">
            <i class="fas fa-bars logo"></i>
        </div>
    </div>

    <script>
        const navbtn = document.querySelector('.logo');

        const navContainer = document.querySelector('header');

        const mainContainer = document.querySelector('.main')

        const ulContainer = document.querySelectorAll('ul');

        const ulList = document.querySelectorAll('nav ul li a')
        let active = false;


        navbtn.addEventListener('click',()=>{
            if(!active){
                active= true;
                navContainer.classList.add('active')
                mainContainer.classList.add('nav')
            }

            else{
                active= false;
                navContainer.classList.remove('active');
                mainContainer.classList.remove('nav');
            }
        })

        ulList.forEach(e => {
            e.addEventListener('click', ()=>{
                active  = false;
                navContainer.classList.remove('active')
                mainContainer.classList.remove('nav')    
            })
        });
    </script>
</body>
</html>
