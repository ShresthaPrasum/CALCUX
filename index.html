<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcux - Calculate anything</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Pixelify+Sans:wght@400..700&amp;family=Unbounded:wght@200..900&amp;display=swap" rel="stylesheet">

    <style>
        :root{
            --font-family : "Unbounded", sans-serif;

        }
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,body{
            background-color: rgb(164, 255, 246);
            scroll-behavior: smooth;
            font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            height: 100%;
        }

        header{
            display: none;
            position: fixed;
            height: 100%;
            z-index: 0;
            top: 0;
            right: 0;
            width: 100%;
            transition: all 0.3s ease;
        }

        nav{
            display: flex;
            position: absolute;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            top: 0;
            right: 0;
            width: 17%;
            height: 100%;
        }

        .brand{
            font-family: "Unbounded", sans-serif;
            position: absolute;
            top: 16px;
            font-size: 1.1rem;
            left: 42px;
        }

        nav ul{
            display: flex;
            flex-direction: column;
            list-style: none;
            gap: 20px;
        }

        nav ul li{
            display: flex;
            margin: 0 20px;
        }

        nav ul li a{
            font-size: 1.8rem;
            font-weight: bold;
        }

        a{
            text-decoration: none;
            color: inherit;
        }

        .nav-main{
            display: flex;
            gap: 20px;
            font-size: 1rem;
        }

        .main{
            /* position: relative; */
            height: 100%;
            transition: all 0.6s ease;
        }

        .logo{
            position: fixed;
            padding: 12px 13px;
            border-radius: 50%;
            font-size: 1.2rem;
            background-color: black;
            color: white;
            right: 42px;
            top: 18px;
            cursor: pointer;
            z-index: 6967;
        }

        .nav{
            transform: translateX(-17%);
        }

        .active{
            display: block;
        }
        

        .hero{
            display: flex;
            justify-content:center;
            align-content: center;
            background: linear-gradient(45deg,rgb(245, 254, 255),rgb(226, 254, 249));
            padding:40px;
            height: 100%;
            /* width: 80%; */
        }

        .hero-container{
            display: flex;
            width: 80%;
            justify-content: center;
            align-items: center;
            /* margin: 0 auto; */
        }

        

        .horizontal{
            position: absolute;
            top: 10%;
            width: 100%;
            border: 1px solid rgba(23, 23, 23, 0.192);
        }
    </style>
</head>
<body>
    <header>
        
        <nav>
            
            <ul>
                <li><a href="#"><i class="fas fa-home"></i>Home</a></li>
                <li><a href="#"><i class="fa-solid fa-calculator"></i>Calculators</a></li>
                <li><a href="#"><i class="fas fa-question"></i></i>How it works</a></li>
                <li><a href="#"><i class="fas fa-circle-info"></i>About Us</a></li>
            </ul>
        </nav>
    </header>
    <div class="main">
        <div class="brand">
            <h1>Calcux</h1>
        </div>
        <hr class="horizontal">

        <i class="fas fa-bars logo">

        </i>

        <div class="hero">
            <div class="container">
                <div class="hero-first">
                    <h1>
                        Calculate Anything And Do the math
                    </h1>
                </div>
    
                <div class="hero-visual">
    
                </div>
            </div>
        </div>
    </div>

    <script>
        const navbtn = document.querySelector('.logo');

        const navContainer = document.querySelector('header');

        const mainContainer = document.querySelector('.main')

        const ulContainer = document.querySelectorAll('ul');

        const ulList = document.querySelectorAll('nav ul li a')
        let active = false;

        // const bgColor = window.getComputedStyle(document.body).backgroundColor;
        const bgColor = window.getComputedStyle(document.body).getPropertyValue('background-color');

        console.log(bgColor);


        navbtn.addEventListener('click',()=>{
            if(!active){
                active= true;
                navContainer.classList.add('active')
                mainContainer.classList.add('nav')
            }

            else{
                active= false;
                // navContainer.classList.remove('active');
                setTimeout(()=>{
                    navContainer.classList.remove('active')
                }, 500)
                mainContainer.classList.remove('nav');
            }
        })

        ulList.forEach(e => {
            e.addEventListener('click', ()=>{
                active  = false;
                // navContainer.classList.remove('active')
                setTimeout(()=>{
                    navContainer.classList.remove('active')
                }, 500)
                mainContainer.classList.remove('nav')    
            })
        });
    </script>
</body>
</html>
